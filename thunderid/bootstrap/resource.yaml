# Orchestration Engine (OE) resource server: declares the `getdata` scope that
# data-consumer clients request via client_credentials to call OE's federated
# data API.
resource_type: resource_server
id: 01900000-0000-7000-8000-000000000090
name: Orchestration Engine Resource Server
description: OE resource server
identifier: http://api.openndx.local
ouHandle: default
resources:
  - name: Consumer
    handle: getdata
    description: Data Consumer
---
# Grants the sample data-consumer app (thunderid/bootstrap/application.yaml,
# id ...091) the `getdata` scope on the OE resource server. No requestable
# `scopes` on that client itself: for client_credentials, the granted scope
# comes from this role instead.
resource_type: role
id: 01900000-0000-7000-8000-000000000092
name: DataConsumerGetData
description: Grants the sample data-consumer app the getdata scope on the OE resource server
ouHandle: default
permissions:
  - resourceServerId: 01900000-0000-7000-8000-000000000090
    permissions:
      - getdata
assignments:
  - id: 01900000-0000-7000-8000-000000000091
    type: app
---
# Consent Engine's own resource server. ThunderID binds an access token's `aud` to
# whatever resource server the caller requests, regardless of role/permission — a
# resource identifier alone is enough to get a token audienced for it (verified: a
# client with no role on this resource server can still mint one). So this MUST be
# a distinct identifier from the OE resource server above: sharing one audience
# between the citizen-facing Consent Portal and the M2M data-consumer flow would let
# either token be replayed against the other service. The Consent Portal must
# request `resource=http://consent.openndx.local` when it authenticates citizens,
# and consent-engine validates against this same value (CONSENT_ENGINE_AUDIENCE).
resource_type: resource_server
id: 01900000-0000-7000-8000-000000000093
name: Consent Engine Resource Server
description: Consent Engine resource server for citizen-facing portal endpoints
identifier: http://consent.openndx.local
ouHandle: default
resources:
  - name: Portal
    handle: access
    description: Consent Portal citizen access
---
# Portal Backend's resource server. Its identifier is PB's API audience: PB
# only accepts access tokens whose `aud` is http://pb.openndx.local
# (IDP_AUDIENCE in compose.yml), whichever client requested them, so clients
# must request `resource=http://pb.openndx.local` (ondx's built-in `local`
# profile does). The OpenNDX_Admin and OpenNDX_Member roles below grant its
# permissions.
resource_type: resource_server
id: 01900000-0000-7000-8000-0000000000b3
name: Portal Backend Resource Server
description: Portal Backend API audience
identifier: http://pb.openndx.local
ouHandle: default
resources:
  - name: Admin
    handle: manage
    description: OpenNDX administrative access
  - name: Member
    handle: member
    description: OpenNDX member organization access

---
# Grants members of the OpenNDX Admins group (thunderid/bootstrap/users.yaml,
# id ...b2) a `roles` claim value of "OpenNDX_Admin" once NDX_CLI requests the
# `roles` scope (see that client's scopeClaims in application.yaml). The NAME
# here is load-bearing: Portal Backend's authorization middleware
# (internal/pb/auth/permissions.go) does an exact string match against
# "OpenNDX_Admin" — not against role IDs or permissions — so this role must be
# named exactly that, unlike ThunderID's own built-in "Administrator" role
# (a different name, for a different authorization domain — see users.yaml).
#
# VERIFIED: confirmed against a running instance by logging in as ndx-admin
# via `ondx login` and decoding the access token — the `roles` claim carries
# role NAMES like this one (not resourceServer:permission strings the way the
# `permissions` block below is scoped).
resource_type: role
id: 01900000-0000-7000-8000-0000000000b4
name: OpenNDX_Admin
description: Grants OpenNDX Portal Backend admin access via the CLI
ouHandle: default
permissions:
  - resourceServerId: 01900000-0000-7000-8000-0000000000b3
    permissions:
      - manage
assignments:
  - id: 01900000-0000-7000-8000-0000000000b2
    type: group
---
# Grants members of the OpenNDX Members group (thunderid/bootstrap/users.yaml,
# id ...c4) a `roles` claim value of "OpenNDX_Member". As with OpenNDX_Admin
# above, the NAME is load-bearing: it must match auth.RoleMember in
# internal/pb/auth/permissions.go exactly, or Portal Backend rejects the token
# for having no valid role.
resource_type: role
id: 01900000-0000-7000-8000-0000000000c5
name: OpenNDX_Member
description: Grants OpenNDX Portal Backend member organization access
ouHandle: default
permissions:
  - resourceServerId: 01900000-0000-7000-8000-0000000000b3
    permissions:
      - member
assignments:
  - id: 01900000-0000-7000-8000-0000000000c4
    type: group
---
# Lets Portal Backend's own M2M client (thunderid/bootstrap/application.yaml,
# id ...d0) call ThunderID's management API: it creates each data-consumer
# application in its member's organization unit and assigns it the
# DataConsumerGetData role above (id ...092). ThunderID 1.0.1 only has the one
# coarse `system` permission on its built-in System resource server (id ...020),
# so this is the same access the Administrator role has.
resource_type: role
id: 01900000-0000-7000-8000-0000000000d1
name: PortalBackendSystem
description: Grants Portal Backend access to ThunderID's management API
ouHandle: default
permissions:
  - resourceServerId: 01900000-0000-7000-8000-000000000020
    permissions:
      - system
assignments:
  - id: 01900000-0000-7000-8000-0000000000d0
    type: app
