# Portal Backend configuration for docker-compose.test.yml, which mounts it at
# /app/config/config.yaml. The IdP and PDP are not started; PB only needs
# their URLs to boot and answer /health.

server:
  port: 8083

cors:
  allowedOrigins:
    - http://localhost:5173

idp:
  jwksURL: http://idp.invalid/oauth2/jwks
  issuer: http://idp.invalid
  audience: http://pb.openndx.local
  management:
    baseURL: http://idp.invalid
    clientID: PORTAL_BACKEND
    clientSecret: test_secret

pdp:
  url: http://pdp.invalid

database:
  driver: postgres
  postgres:
    host: postgres-test
    port: 5432
    user: test_user
    password: test_password
    name: portal_backend_test
    sslMode: disable
