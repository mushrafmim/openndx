services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: portal_backend_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/pb-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d portal_backend_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  portal-backend-test:
    build:
      context: ../..
      dockerfile: cmd/pb/Dockerfile
    volumes:
      - ./config.test.yaml:/app/config/config.yaml:ro
    ports:
      - "3001:8083"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8083/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_test_data:
