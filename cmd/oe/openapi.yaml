openapi: 3.0.3
info:
  title: Orchestration Engine API
  version: 1.0.0
  description: |
    The Orchestration Engine federates consumer GraphQL queries across data providers.
    This document describes the health endpoint. The consumer endpoint, `POST /public/graphql`,
    is described in cmd/oe/README.md and cmd/oe/AUTHENTICATION.md.
  contact:
    name: OpenNDX Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:4000
    description: Local Development Environment

paths:
  /health:
    get:
      summary: Health check
      description: Returns a health check message.
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Successful health response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: "OpenNDX Server is Healthy!"

tags:
  - name: Health
    description: Health check endpoints
