services:
  # Policy Decision Point Service
  policy-decision-point:
    build:
      context: ../..
      dockerfile: cmd/pdp/Dockerfile
    volumes:
      - ./pdp-config.yaml:/app/config/config.yaml:ro
    ports:
      - "8082:8082"
    depends_on:
      pdp-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8082/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Consent Engine Service
  consent-engine:
    build:
      context: ../..
      dockerfile: cmd/ce/Dockerfile
    environment:
      PORT: 8081
      LOG_LEVEL: info
      # V1 database env vars (for v1/database/database.go)
      DB_HOST: ce-db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: consent_db
      DB_SSLMODE: disable
      # JWT/Asgardeo configuration for V1 auth (using Google's public JWKS for testing)
      IDP_JWKS_URL: "https://www.googleapis.com/oauth2/v3/certs"
      IDP_ISSUER: "https://accounts.google.com"
      IDP_AUDIENCE: "test-audience"
    ports:
      - "8081:8081"
    depends_on:
      ce-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Orchestration Engine Service
  orchestration-engine:
    build:
      context: ../..
      dockerfile: cmd/oe/Dockerfile
    environment:
      PORT: 4000
      LOG_LEVEL: info
      PDP_URL: http://policy-decision-point:8082
      CONSENT_ENGINE_URL: http://consent-engine:8081
      CONFIG_PATH: /app/config/config.json
      # The mock provider signs the tests' consumer tokens and serves the JWKS
      # the OE verifies them against.
      IDP_JWKS_URL: http://mock-provider:8083/jwks
      IDP_ISSUER: http://mock-idp.test
      IDP_AUDIENCE: http://api.openndx.local
    volumes:
      - ./config.json:/app/config/config.json:ro
      # Next to the config: the OE reads schemaPath (default schema.graphql)
      # relative to the config file's directory.
      - ./schema.graphql:/app/config/schema.graphql:ro
    ports:
      - "4000:4000"
    depends_on:
      policy-decision-point:
        condition: service_healthy
      consent-engine:
        condition: service_healthy
      mock-provider:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Mock data provider, which also signs the tests' consumer tokens (POST /token)
  # and serves the JWKS the Orchestration Engine verifies them against (GET /jwks)
  mock-provider:
    build:
      context: ./mock-provider
    ports:
      - "8083:8083"
