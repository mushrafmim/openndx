services:
  # Policy Decision Point Service
  policy-decision-point:
    build:
      context: ../..
      dockerfile: cmd/pdp/Dockerfile
    volumes:
      - ./pdp-config.yaml:/app/config/config.yaml:ro
    ports:
      - "8082:8082"
    depends_on:
      pdp-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8082/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Consent Engine Service
  consent-engine:
    build:
      context: ../..
      dockerfile: cmd/ce/Dockerfile
    volumes:
      - ./ce-config.yaml:/app/config/config.yaml:ro
    ports:
      - "8081:8081"
    depends_on:
      ce-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Orchestration Engine Service
  orchestration-engine:
    build:
      context: ../..
      dockerfile: cmd/oe/Dockerfile
    volumes:
      - ./oe-config.yaml:/app/config/config.yaml:ro
      # Next to the config: the OE reads schemaPath (default schema.graphql)
      # relative to the config file's directory.
      - ./schema.graphql:/app/config/schema.graphql:ro
    ports:
      - "4000:4000"
    depends_on:
      policy-decision-point:
        condition: service_healthy
      consent-engine:
        condition: service_healthy
      mock-provider:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Mock data provider, which also signs the tests' consumer tokens (POST /token)
  # and serves the JWKS the Orchestration Engine verifies them against (GET /jwks)
  mock-provider:
    build:
      context: ./mock-provider
    ports:
      - "8083:8083"
